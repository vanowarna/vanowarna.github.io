<body>
    <!-- Three.js particle background -->

                <div class="terminal-title">vanowarna@portfolio:~/cv</div>

            </div>
            <div class="terminal-body" id="terminal-body">

                <div class="input-line" id="input-line">
                    <span class="prompt" aria-hidden="true">visitor@cv&gt;</span>
                    <input id="command-input" class="input" type="text" autocomplete="off" spellcheck="false" aria-label="Terminal command input" placeholder="type a command...">
                    <span class="mobile-cursor" aria-hidden="true"></span>
                </div>
            </div>
            <div class="terminal-footer" id="chip-bar">
                <span class="chip" data-cmd="help">help</span>
                <span class="chip" data-cmd="about">about</span>
                <span class="chip" data-cmd="interests">interests</span>
                <span class="chip" data-cmd="edu">edu</span>
                <span class="chip" data-cmd="skills">skills</span>
                <span class="chip" data-cmd="work">work</span>
                <span class="chip" data-cmd="research">research</span>
                <span class="chip" data-cmd="pubs">pubs</span>
                <span class="chip" data-cmd="awards">awards</span>
                <span class="chip" data-cmd="leadership">leadership</span>
                <span class="chip" data-cmd="contact">contact</span>
                <span class="chip" data-cmd="all">all</span>
                <span class="chip chip--danger" data-cmd="clear">clear</span>
            </div>
