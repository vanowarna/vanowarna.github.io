# Cloudflare Worker configuration for the portfolio's "ask" feature.
# Deploy with:  npx wrangler deploy   (run inside this folder)

name = "vanowarna-ask"
main = "worker.js"
compatibility_date = "2026-01-01"
workers_dev = true

[vars]
# Free-model router: picks an available free model, never a paid one.
# To pin one model instead, use its id ending in ":free" from openrouter.ai/models.
MODEL = "openrouter/free"
SITE_URL = "https://vanowarna.com"
CV_URL = "https://vanowarna.com/content/cv.json"
# Only these origins may call the Worker (comma separated, no trailing slash).
ALLOWED_ORIGINS = "https://vanowarna.com,https://www.vanowarna.com,https://vanowarna.github.io"

# At most 5 questions per visitor (IP address) per minute.
[[ratelimits]]
name = "ASK_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# The API key is NOT stored here. Add it once with:
#   npx wrangler secret put OPENROUTER_API_KEY
